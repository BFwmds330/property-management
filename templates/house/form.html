{% extends "base.html" %}
{% block title %}{{ '修改房屋' if house else '新增房屋' }} - 物业管家{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card app-card">
      <div class="card-header">{{ '✏️ 修改房屋' if house else '🏠 新增房屋' }}</div>
      <div class="card-body">
        <form method="post"
              action="{{ url_for('house.house_edit_post', hid=house.id) if house else url_for('house.house_add_post') }}">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">楼栋 <span class="req">＊</span></label>
              <select class="form-select" name="building_id" required>
                <option value="">请选择楼栋</option>
                {% for b in buildings %}
                <option value="{{ b.id }}" {{ sel('building_id', b.id, house.building_id if house else '') }}>
                  {{ b.code }}（{{ b.units }} 单元 / {{ b.floors }} 层）
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label">单元 <span class="req">＊</span></label>
              <input class="form-control" type="number" name="unit" min="1" max="20" required
                     value="{{ v('unit', house.unit if house else 1) }}">
            </div>
            <div class="col-md-2">
              <label class="form-label">楼层 <span class="req">＊</span></label>
              <input class="form-control" type="number" name="floor" min="1" max="99" required
                     value="{{ v('floor', house.floor if house else '') }}">
            </div>
            <div class="col-md-2">
              <label class="form-label">房号 <span class="req">＊</span></label>
              <input class="form-control" type="number" name="room_no" min="1" max="9999" required
                     value="{{ v('room_no', house.room_no if house else '') }}" placeholder="如 1501">
              <div class="form-text-hint">楼栋+单元+楼层+房号 不能重复</div>
            </div>
            <div class="col-md-2">
              <label class="form-label">状态</label>
              <select class="form-select" name="status">
                {% for k, label in HOUSE_STATUS.items() %}
                <option value="{{ k }}" {{ sel('status', k, house.status if house else 'vacant') }}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">建筑面积（㎡）</label>
              <input class="form-control" type="number" step="0.01" min="0" name="area"
                     value="{{ v('area', (house.area_100 / 100) | string if house else '') }}">
            </div>
            <div class="col-md-4">
              <label class="form-label">套内面积（㎡）</label>
              <input class="form-control" type="number" step="0.01" min="0" name="inner_area"
                     value="{{ v('inner_area', (house.inner_area_100 / 100) | string if house else '') }}">
            </div>
            <div class="col-md-4">
              <label class="form-label">绑定户型</label>
              <select class="form-select" name="house_type_id">
                <option value="">暂不绑定</option>
                {% for t in types %}
                <option value="{{ t.id }}" {{ sel('house_type_id', t.id, house.house_type_id if house else '') }}>{{ t.name }}（{{ (t.area_100 / 100) | round(2) }}㎡）</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">入住日期</label>
              <input class="form-control" type="date" name="occupied_date"
                     value="{{ v('occupied_date', house.occupied_date if house else '') }}">
            </div>
            <div class="col-12">
              <label class="form-label">备注</label>
              <textarea class="form-control" name="remark" rows="2" maxlength="300">{{ v('remark', house.remark if house else '') }}</textarea>
            </div>
          </div>

          {% if not house %}
          <hr class="my-4">
          <label class="form-label fw-bold">登记业主（可选，之后也可以在房屋详情里补登）</label>
          <div class="row g-3">
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="owner_mode" id="omNone" value="none" checked>
                <label class="form-check-label" for="omNone">暂不登记</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="owner_mode" id="omNew" value="new">
                <label class="form-check-label" for="omNew">新建业主</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="owner_mode" id="omExist" value="existing">
                <label class="form-check-label" for="omExist">选择已有住户</label>
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label">业主姓名</label>
              <input class="form-control" name="owner_name" maxlength="50" value="{{ v('owner_name') }}" placeholder="选择“新建业主”时填写">
            </div>
            <div class="col-md-4">
              <label class="form-label">业主手机号</label>
              <input class="form-control" name="owner_phone" maxlength="20" value="{{ v('owner_phone') }}" placeholder="11 位数字">
            </div>
            <div class="col-md-4">
              <label class="form-label">已有住户</label>
              <select class="form-select" name="owner_resident_id">
                <option value="">请选择</option>
                {% for r in residents %}
                <option value="{{ r.resident_id }}">{{ r.name }}{% if r.phone %}（{{ r.phone }}）{% endif %}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          {% endif %}

          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-success px-4">保存</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('house.house_list') }}">取消</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
